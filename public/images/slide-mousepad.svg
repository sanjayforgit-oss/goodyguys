<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="s5Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#071b26"/>
      <stop offset="50%" stop-color="#041018"/>
      <stop offset="100%" stop-color="#02080c"/>
    </linearGradient>
    <linearGradient id="cyanBlue" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#s5Bg)"/>
  <circle cx="950" cy="250" r="220" fill="#06b6d4" opacity="0.12"/>

  <!-- Left Content -->
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#06b6d4" fill-opacity="0.25" stroke="#06b6d4"/>
    <text x="110" y="22" text-anchor="middle" fill="#67e8f9" font-family="'Inter', sans-serif" font-size="13" font-weight="700">🖱️ DESK ACCESSORIES</text>
    
    <text x="0" y="90" fill="#ffffff" font-family="'Inter', sans-serif" font-size="46" font-weight="900" letter-spacing="-1">Custom Gaming &amp; Desk</text>
    <text x="0" y="145" fill="url(#cyanBlue)" font-family="'Inter', sans-serif" font-size="46" font-weight="900" letter-spacing="-1">Mouse Pads with HD Print</text>
    
    <text x="0" y="195" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="18" font-weight="400">Micro-textured speed cloth, anti-slip rubber grip, and vivid edge-to-edge sublimation.</text>
    
    <g transform="translate(0, 235)">
