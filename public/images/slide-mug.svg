      <stop offset="0%" stop-color="#240c1b"/>
      <stop offset="50%" stop-color="#14060e"/>
      <stop offset="100%" stop-color="#0a0207"/>
    </linearGradient>
    <linearGradient id="pinkOrange" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ec4899"/>
