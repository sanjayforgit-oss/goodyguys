<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="engBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18182e"/>
      <stop offset="100%" stop-color="#0b0b14"/>
    </linearGradient>
    <linearGradient id="acrylicGlass" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.25"/>
      <stop offset="50%" stop-color="#38bdf8" stop-opacity="0.10"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.18"/>
    </linearGradient>
    <linearGradient id="woodBase" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#78350f"/>
      <stop offset="50%" stop-color="#92400e"/>
      <stop offset="100%" stop-color="#78350f"/>
    </linearGradient>
    <filter id="engraveGlow">
      <feDropShadow dx="0" dy="0" stdDeviation="5" flood-color="#38bdf8" flood-opacity="0.8"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="24" fill="url(#engBg)"/>

  <!-- CO2 Laser Beam Effect from top corner -->
  <line x1="450" y1="30" x2="250" y2="230" stroke="#f43f5e" stroke-width="2" stroke-dasharray="6 4" opacity="0.85"/>
  <circle cx="250" cy="230" r="4" fill="#ffedd5" filter="url(#engraveGlow)"/>
  <circle cx="250" cy="230" r="1.5" fill="#f43f5e"/>

  <!-- Acrylic Plate -->
  <g transform="translate(100, 80)">
    <!-- Plate Body with glass shine -->
    <rect x="0" y="0" width="300" height="230" rx="18" fill="url(#acrylicGlass)" stroke="#38bdf8" stroke-width="2" stroke-opacity="0.7"/>
    <!-- Highlight Reflection Bar -->
    <path d="M 15 15 L 180 15 L 80 215 L 15 215 Z" fill="#ffffff" opacity="0.06"/>

    <!-- Engraved Artwork & Text -->
    <rect x="25" y="25" width="250" height="180" rx="10" fill="none" stroke="#e0f2fe" stroke-width="1.5" stroke-dasharray="5 4" opacity="0.7"/>
    
    <g transform="translate(150, 95)">
      <path d="M -30 -15 C -30 -35 30 -35 30 -15 C 30 10 0 25 0 35 C 0 25 -30 10 -30 -15 Z" fill="none" stroke="#bae6fd" stroke-width="2" filter="url(#engraveGlow)"/>
      <text x="0" y="55" text-anchor="middle" fill="#f0f9ff" font-family="'Inter', cursive, sans-serif" font-size="20" font-weight="700" filter="url(#engraveGlow)">Alex &amp; Sophia</text>
      <text x="0" y="78" text-anchor="middle" fill="#7dd3fc" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="2">CO2 LASER ENGRAVED</text>
      <text x="0" y="94" text-anchor="middle" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="10">Est. 2026 • Permanent Detail</text>
    </g>

    <!-- Base Slot -->
    <rect x="20" y="215" width="260" height="40" rx="8" fill="url(#woodBase)" stroke="#451a03" stroke-width="2"/>
    <rect x="25" y="217" width="250" height="6" fill="#b45309" opacity="0.5"/>
  </g>

  <!-- Laser Badge -->
  <rect x="35" y="420" width="165" height="34" rx="17" fill="#38bdf8" fill-opacity="0.2" stroke="#38bdf8" stroke-width="1.5"/>
  <text x="117" y="442" text-anchor="middle" fill="#7dd3fc" font-family="'Inter', sans-serif" font-size="13" font-weight="600">CO2 Precision Laser</text>
</svg>
