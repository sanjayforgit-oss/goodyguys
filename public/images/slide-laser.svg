<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="s2Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#191505"/>
      <stop offset="50%" stop-color="#120e03"/>
      <stop offset="100%" stop-color="#0a0802"/>
    </linearGradient>
    <linearGradient id="goldText" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="50%" stop-color="#eab308"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#s2Bg)"/>
  <circle cx="950" cy="250" r="220" fill="#eab308" opacity="0.12"/>

  <!-- Left Content -->
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="220" height="34" rx="17" fill="#eab308" fill-opacity="0.25" stroke="#eab308"/>
    <text x="110" y="22" text-anchor="middle" fill="#fef08a" font-family="'Inter', sans-serif" font-size="13" font-weight="700">⚡ CO2 LASER CUTTER</text>
    
    <text x="0" y="90" fill="#ffffff" font-family="'Inter', sans-serif" font-size="46" font-weight="900" letter-spacing="-1">Acrylic Name Cutting</text>
    <text x="0" y="145" fill="url(#goldText)" font-family="'Inter', sans-serif" font-size="46" font-weight="900" letter-spacing="-1">&amp; Precision Engraving</text>
    
    <text x="0" y="195" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="18" font-weight="400">High-precision laser cut letters, custom name keychains, &amp; etched acrylic sheets.</text>
    
    <g transform="translate(0, 235)">
      <rect x="0" y="0" width="160" height="46" rx="23" fill="url(#goldText)"/>
      <text x="80" y="29" text-anchor="middle" fill="#000000" font-family="'Inter', sans-serif" font-size="16" font-weight="800">Only ₹100 →</text>
      
      <text x="180" y="30" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="14" font-weight="600">✓ Mirror Gold &amp; Clear  ✓ Any Name / Font</text>
    </g>
  </g>

  <!-- Right Visual -->
  <g transform="translate(780, 50)">
    <circle cx="170" cy="200" r="160" fill="#261f0a" stroke="#54410a" stroke-width="2"/>
    <image href="/images/acrylic-cut.svg" x="20" y="50" width="300" height="300"/>
  </g>
