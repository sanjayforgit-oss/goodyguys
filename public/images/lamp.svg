<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="lampBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141426"/>
      <stop offset="100%" stop-color="#070710"/>
    </linearGradient>
    <linearGradient id="warmLight" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#fef08a" stop-opacity="0.9"/>
      <stop offset="40%" stop-color="#f59e0b" stop-opacity="0.6"/>
      <stop offset="100%" stop-color="#f59e0b" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="solidWood" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#5a2d0c"/>
      <stop offset="50%" stop-color="#854d0e"/>
      <stop offset="100%" stop-color="#5a2d0c"/>
    </linearGradient>
    <filter id="superGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="16" result="blur1"/>
      <feGaussianBlur stdDeviation="6" result="blur2"/>
      <feMerge>
        <feMergeNode in="blur1"/>
        <feMergeNode in="blur2"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <rect width="500" height="500" rx="24" fill="url(#lampBg)"/>

  <!-- Ambient Light Glow in dark room -->
  <circle cx="250" cy="220" r="140" fill="#f59e0b" opacity="0.18" filter="url(#superGlow)"/>

  <!-- Acrylic Plaque Outline -->
  <g transform="translate(130, 60)">
    <!-- Acrylic Shape (Heart / Arc / Plaque) -->
    <path d="M 40 270 L 40 100 Q 40 40 120 40 Q 200 40 200 100 L 200 270 Z" fill="#ffffff" fill-opacity="0.08" stroke="#fef08a" stroke-width="2" stroke-opacity="0.6"/>

    <!-- Light beam from slot upwards -->
    <polygon points="50,270 70,120 170,120 190,270" fill="url(#warmLight)" opacity="0.45"/>

    <!-- Glowing Engraved Artwork -->
    <g transform="translate(120, 140)" filter="url(#superGlow)">
      <!-- Line Art Couple / Motif -->
      <path d="M -25 -20 C -25 -40 25 -40 25 -20 C 25 5 0 20 0 35 C 0 20 -25 5 -25 -20 Z" fill="none" stroke="#fef08a" stroke-width="3"/>
      <circle cx="0" cy="-20" r="8" fill="#fef08a" opacity="0.8"/>
      <text x="0" y="65" text-anchor="middle" fill="#fef08a" font-family="'Brush Script MT', cursive, sans-serif" font-size="24" font-weight="bold">Forever &amp; Always</text>
      <text x="0" y="85" text-anchor="middle" fill="#fde68a" font-family="'Inter', sans-serif" font-size="11" font-weight="600" letter-spacing="1">14 • 02 • 2026</text>
    </g>

    <!-- Wooden LED Base -->
    <g transform="translate(10, 260)">
      <rect x="0" y="0" width="220" height="48" rx="12" fill="url(#solidWood)" stroke="#3f1d07" stroke-width="2"/>
      <!-- Slot for Acrylic -->
      <rect x="25" y="2" width="170" height="6" fill="#fef08a" filter="url(#superGlow)"/>
      <circle cx="190" cy="24" r="5" fill="#ca8a04"/>
    </g>
  </g>

  <!-- Product badge -->
  <rect x="35" y="420" width="180" height="34" rx="17" fill="#f59e0b" fill-opacity="0.2" stroke="#f59e0b" stroke-width="1.5"/>
  <text x="125" y="442" text-anchor="middle" fill="#fde68a" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Warm LED Wooden Base</text>
</svg>
