  </defs>
  <rect width="1200" height="500" fill="url(#s3Bg)"/>
  <circle cx="950" cy="250" r="220" fill="#ec4899" opacity="0.12"/>

  <!-- Left Content -->
  <g transform="translate(80, 110)">
