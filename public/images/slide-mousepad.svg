      <text x="80" y="29" text-anchor="middle" fill="#000000" font-family="'Inter', sans-serif" font-size="16" font-weight="800">Only ₹150 →</text>
      
      <text x="180" y="30" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="14" font-weight="600">✓ Non-Slip Grip  ✓ High-DPI Tracking</text>
