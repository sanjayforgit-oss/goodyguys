<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 500" width="100%" height="100%">
  <defs>
    <linearGradient id="s1Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e1035"/>
      <stop offset="50%" stop-color="#120c24"/>
      <stop offset="100%" stop-color="#0b0716"/>
    </linearGradient>
    <linearGradient id="s1Glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#ec4899"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="500" fill="url(#s1Bg)"/>
  <circle cx="950" cy="250" r="220" fill="#8b5cf6" opacity="0.12"/>
  <circle cx="200" cy="100" r="150" fill="#ec4899" opacity="0.08"/>

  <!-- Left Content -->
  <g transform="translate(80, 110)">
    <rect x="0" y="0" width="190" height="34" rx="17" fill="#8b5cf6" fill-opacity="0.25" stroke="#8b5cf6"/>
    <text x="95" y="22" text-anchor="middle" fill="#c4b5fd" font-family="'Inter', sans-serif" font-size="13" font-weight="700">👕 APPAREL PRINTING</text>
    
    <text x="0" y="90" fill="#ffffff" font-family="'Inter', sans-serif" font-size="46" font-weight="900" letter-spacing="-1">Custom T-Shirt Prints</text>
    <text x="0" y="145" fill="url(#s1Glow)" font-family="'Inter', sans-serif" font-size="46" font-weight="900" letter-spacing="-1">Front, Back &amp; Both Sides</text>
    
    <text x="0" y="195" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="18" font-weight="400">Upload any design, photo, or brand logo. Premium 100% breathable cotton.</text>
    
    <g transform="translate(0, 235)">
      <rect x="0" y="0" width="160" height="46" rx="23" fill="url(#s1Glow)"/>
      <text x="80" y="29" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-size="16" font-weight="800">Only ₹300 →</text>
      
      <text x="180" y="30" fill="#cbd5e1" font-family="'Inter', sans-serif" font-size="14" font-weight="600">✓ Wash Resistant  ✓ HD Color</text>
    </g>
  </g>

  <!-- Right Graphic Visual -->
  <g transform="translate(780, 50)">
    <circle cx="170" cy="200" r="160" fill="#1e1838" stroke="#382960" stroke-width="2"/>
    <image href="/images/tshirt.svg" x="20" y="50" width="300" height="300"/>
  </g>
