<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="mugBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18182e"/>
      <stop offset="100%" stop-color="#0f0f1c"/>
    </linearGradient>
    <linearGradient id="ceramicGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#dedede"/>
      <stop offset="25%" stop-color="#ffffff"/>
      <stop offset="75%" stop-color="#f0f2f5"/>
      <stop offset="100%" stop-color="#c9ced6"/>
    </linearGradient>
    <linearGradient id="innerMug" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#475569"/>
      <stop offset="100%" stop-color="#1e293b"/>
    </linearGradient>
    <linearGradient id="mugArt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ec4899"/>
      <stop offset="100%" stop-color="#f59e0b"/>
    </linearGradient>
    <filter id="mugShadow">
      <feDropShadow dx="0" dy="20" stdDeviation="20" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="24" fill="url(#mugBg)"/>

  <!-- Mug Group -->
  <g transform="translate(100, 80)" filter="url(#mugShadow)">
    <!-- Handle -->
    <path d="M 230 110 C 310 110 320 220 230 230" fill="none" stroke="#e2e8f0" stroke-width="26" stroke-linecap="round"/>
    <path d="M 230 110 C 298 110 306 220 230 230" fill="none" stroke="#cbd5e1" stroke-width="12" stroke-linecap="round"/>

    <!-- Cylinder Body -->
    <rect x="40" y="80" width="200" height="230" rx="16" fill="url(#ceramicGrad)"/>
    <!-- Bottom Ellipse -->
    <ellipse cx="140" cy="305" rx="100" ry="24" fill="url(#ceramicGrad)"/>
    <!-- Top Rim Opening -->
    <ellipse cx="140" cy="80" rx="100" ry="24" fill="url(#ceramicGrad)" stroke="#cbd5e1" stroke-width="2"/>
    <ellipse cx="140" cy="80" rx="90" ry="18" fill="url(#innerMug)"/>

    <!-- 1 / 2 / 3 Sides Custom Print Graphic Wrap -->
    <g transform="translate(65, 125)">
      <rect x="0" y="0" width="150" height="130" rx="12" fill="url(#mugArt)" opacity="0.95"/>
      <circle cx="75" cy="50" r="28" fill="#ffffff" opacity="0.9"/>
      <path d="M60 55 L75 35 L90 55 Z" fill="#ec4899"/>
      <text x="75" y="100" text-anchor="middle" fill="#ffffff" font-family="'Inter', sans-serif" font-size="12" font-weight="800">CUSTOM PRINT</text>
      <text x="75" y="116" text-anchor="middle" fill="#fef08a" font-family="'Inter', sans-serif" font-size="9" font-weight="600">1, 2 or 3 SIDES</text>
    </g>

    <!-- Side Indicators / Badges -->
    <g transform="translate(14, 330)">
      <rect x="0" y="0" width="70" height="24" rx="12" fill="#ec4899" fill-opacity="0.3" stroke="#ec4899"/>
      <text x="35" y="16" text-anchor="middle" fill="#fbcfe8" font-family="'Inter', sans-serif" font-size="10" font-weight="700">1 SIDE</text>

      <rect x="80" y="0" width="70" height="24" rx="12" fill="#8b5cf6" fill-opacity="0.3" stroke="#8b5cf6"/>
      <text x="115" y="16" text-anchor="middle" fill="#ddd6fe" font-family="'Inter', sans-serif" font-size="10" font-weight="700">2 SIDES</text>

      <rect x="160" y="0" width="70" height="24" rx="12" fill="#f59e0b" fill-opacity="0.3" stroke="#f59e0b"/>
      <text x="195" y="16" text-anchor="middle" fill="#fef3c7" font-family="'Inter', sans-serif" font-size="10" font-weight="700">3 SIDES</text>
    </g>
  </g>

  <rect x="35" y="440" width="150" height="30" rx="15" fill="#ec4899" fill-opacity="0.2" stroke="#ec4899" stroke-width="1.5"/>
  <text x="110" y="460" text-anchor="middle" fill="#f472b6" font-family="'Inter', sans-serif" font-size="12" font-weight="600">Glossy Ceramic 11oz</text>
</svg>
