    <text x="95" y="22" text-anchor="middle" fill="#fbcfe8" font-family="'Inter', sans-serif" font-size="13" font-weight="700">☕ DRINKWARE</text>
    
    <text x="0" y="90" fill="#ffffff" font-family="'Inter', sans-serif" font-size="46" font-weight="900" letter-spacing="-1">Custom Ceramic Mugs</text>
    <text x="0" y="145" fill="url(#pinkOrange)" font-family="'Inter', sans-serif" font-size="46" font-weight="900" letter-spacing="-1">1, 2, or 3 Sides Wrap</text>
    
    <text x="0" y="195" fill="#94a3b8" font-family="'Inter', sans-serif" font-size="18" font-weight="400">1 Side ₹150 • 2 Sides ₹175 • 3 Sides Full Wrap ₹200. Dishwasher &amp; Microwave safe.</text>
    
