<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <linearGradient id="cutBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18182e"/>
      <stop offset="100%" stop-color="#0b0b14"/>
    </linearGradient>
    <linearGradient id="goldMirror" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fef08a"/>
      <stop offset="30%" stop-color="#eab308"/>
      <stop offset="60%" stop-color="#ca8a04"/>
      <stop offset="85%" stop-color="#fef08a"/>
      <stop offset="100%" stop-color="#a16207"/>
    </linearGradient>
    <filter id="goldGlow">
      <feDropShadow dx="3" dy="8" stdDeviation="6" flood-color="#ca8a04" flood-opacity="0.5"/>
    </filter>
  </defs>
  <rect width="500" height="500" rx="24" fill="url(#cutBg)"/>

  <!-- Keychain Ring & Chain -->
  <g transform="translate(140, 50)">
    <!-- Metal Ring -->
    <circle cx="110" cy="40" r="32" fill="none" stroke="#cbd5e1" stroke-width="8"/>
    <circle cx="110" cy="40" r="28" fill="none" stroke="#94a3b8" stroke-width="2"/>
    <!-- Chain Links -->
    <ellipse cx="110" cy="85" rx="8" ry="14" fill="none" stroke="#cbd5e1" stroke-width="5"/>
    <ellipse cx="110" cy="115" rx="8" ry="14" fill="none" stroke="#94a3b8" stroke-width="5"/>
    <ellipse cx="110" cy="142" rx="7" ry="12" fill="none" stroke="#cbd5e1" stroke-width="5"/>
  </g>

  <!-- Laser Cut Acrylic Name Plate -->
  <g transform="translate(50, 190)" filter="url(#goldGlow)">
    <!-- Backing/Hole for ring -->
    <circle cx="200" cy="10" r="14" fill="url(#goldMirror)" stroke="#713f12" stroke-width="2"/>
    <circle cx="200" cy="10" r="6" fill="#18182e"/>

    <!-- Cut Out Outline of Name "Priya" in elegant cursive calligraphy style -->
    <rect x="25" y="24" width="350" height="130" rx="35" fill="#1a1405" stroke="url(#goldMirror)" stroke-width="3"/>
    
    <!-- Cut 3D Gold Text -->
    <text x="200" y="105" text-anchor="middle" fill="url(#goldMirror)" font-family="'Brush Script MT', 'Dancing Script', cursive, sans-serif" font-size="64" font-weight="bold" letter-spacing="3" stroke="#854d0e" stroke-width="1.5">Priya ✨</text>
    <text x="200" y="136" text-anchor="middle" fill="#fef08a" font-family="'Inter', sans-serif" font-size="11" font-weight="700" letter-spacing="2">CO2 LASER CONTOUR CUT</text>
  </g>

  <!-- Tag details -->
  <rect x="35" y="420" width="180" height="34" rx="17" fill="#eab308" fill-opacity="0.2" stroke="#eab308" stroke-width="1.5"/>
  <text x="125" y="442" text-anchor="middle" fill="#fef08a" font-family="'Inter', sans-serif" font-size="13" font-weight="600">Mirror Gold &amp; Clear Acrylic</text>
</svg>
